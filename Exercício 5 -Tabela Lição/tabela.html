<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=[device-width], initial-scale=1.0">
    <title>VELOZ AUTO</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="conteiner">

        <img class="img-top" src="./img/Pictures/logoImage.png  ">

        <h1>Modelos de carros</h1>
        <p class="disc">
            Tabela de veiculos disponiveis em estoque
        </p>

        <table>
            <thead>
                <tr>

                    <th class="col-marca">Marca</th>
                    <th class="col-modelo">Modelo</th>
                    <th class="col-ano">Ano</th>

                    <!-- COMEÇO FIAT -->

                </tr>
            </thead>
            <tbody>

                <tr>
                    <td rowspan="2">BMW</td>
                    <td>

                        <div class="img-cars">

                            <img src="./img/Pictures/bmw1image.jpg" alt="Carro">
                            <span>BMW SÉRIE 3</span>


                        </div>
                    </td>
                    <td>2026</td>
                </tr>
                <tr>
                    <td>

                        <div class="img-cars">

                            <img src="./img/Pictures/bmw2image.webp" alt="Carro">
                            <span>BMW I4</span>


                        </div>
                    </td>
                    <td>2021</td>
                </tr>

                <!-- COMEÇO CHEVROLET -->

                <tr>
                    <td rowspan="3">TOYOTA</td>
                    <td>

                        <div class="img-cars">

                            <img src="./img/Pictures/toyota1image.png" alt="Carro">
                            <span>TOYOTA COROLLA CROSS</span>


                        </div>
                    </td>
                    <td>2025</td>
                </tr>
                <tr>
                    <td>

                        <div class="img-cars">

                            <img src="./img/Pictures/toyota2image.png" alt="Carro">
                            <span>TOYOTA COROLLA</span>


                        </div>
                    </td>
                    <td>2024</td>
                </tr>
                <tr>
                    <td>

                        <div class="img-cars">

                            <img src="./img/Pictures/toyota3image.avif" alt="Carro">
                            <span>TOYOTA HILUX</span>


                        </div>
                    </td>
                    <td>2024</td>
                </tr>

                </tr>

                <!-- COMEÇO BYD -->

                <tr>
                    <td rowspan="2">BYD</td>
                    <td>

                        <div class="img-cars">

                            <img src="./img/Pictures/byd2Image.webp.webp" alt="Carro">
                            <span>BYD KING</span>


                        </div>
                    </td>
                    <td>2023</td>
                </tr>
                <tr>
                    <td>

                        <div class="img-cars">

                            <img src="./img/Pictures/byd1Image.webp" alt="Carro">
                            <span>BYD DOLPHIN</span>


                        </div>
                    </td>
                    <td>2023</td>
                </tr>

            </tbody>
            <tfoot>
                <tr>
                    <td colspan="3">Última Atualização: 27/03/2026</td>



                </tr>


            </tfoot>

        </table>

        <img class="rodape-image" src="./img/Pictures/byd3Image.webp" alt="VelozAuto">
        <p>BYD SONG ULTRA</p>
    </div>

</body>

</html>
